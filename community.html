<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community — Wandr</title>
  <meta name="description" content="Plan travel in Ghana in one place: attractions, trips, stays and other travellers.">

  <link rel="icon" type="image/png" href="Images/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="communitydesign.css">

  <script>document.documentElement.classList.add("js");</script>
  <script type="module" src="js/main.js"></script>
</head>

<body data-page="community">

  <header class="site-header">
    <div class="site-header__inner">
      <a class="logo" href="home.html">
        <img src="Images/apple-touch-icon.png" alt="" width="30" height="30">
        <span>Wandr.</span>
      </a>
      <nav class="main-nav" id="main-nav">
        <ul>
          <li><a href="home.html">Home</a></li>
          <li><a href="explore.html">Explore</a></li>
          <li><a href="trips.html">Trips</a></li>
          <li><a href="stays.html">Stays</a></li>
          <li><a class="is-current" href="community.html">Community</a></li>
        </ul>
      </nav>
      <a class="btn btn--solid" href="signin.html">Sign in</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
        <span class="menu-toggle__bars" aria-hidden="true"></span>
        <span class="visually-hidden">Menu</span>
      </button>
    </div>
  </header>


  <main class="page">

    <section class="intro">
      <p class="intro__greeting" data-community-stats>Talk with other travellers</p>
      <h1 class="intro__title">Community</h1>
    </section>

    <section class="categories">
      <h2 class="visually-hidden">Filter rooms</h2>
      <ul class="chips">
        <li><button class="chip chip--active" type="button" data-filter="all" aria-pressed="true">All rooms</button></li>
        <li><button class="chip" type="button" data-filter="joined" aria-pressed="false">Joined</button></li>
        <li><button class="chip" type="button" data-filter="regions" aria-pressed="false">Regions</button></li>
        <li><button class="chip" type="button" data-filter="buddies" aria-pressed="false">Trip buddies</button></li>
      </ul>
    </section>

    <section class="community" data-community>
      <aside class="rooms" aria-label="Chat rooms">
        <div class="rooms__head">
          <h2 class="rooms__title">Chat rooms</h2>
          <button class="btn rooms__new" type="button" data-new-room>New room</button>
        </div>
        <label class="visually-hidden" for="room-search">Find a room</label>
        <input class="rooms__search" id="room-search" type="search" placeholder="Find a room" autocomplete="off">
        <ul class="rooms__list" data-rooms>
          <li class="rooms__note">Loading rooms…</li>
        </ul>
        <p class="rooms__note" data-rooms-empty hidden>No rooms match. Try another word or start a new room.</p>
      </aside>

      <div class="chat" id="chat">
        <header class="chat__head">
          <button class="chat__back" type="button" data-back aria-label="Back to rooms">‹</button>
          <span class="avatar" aria-hidden="true"></span>
          <div class="chat__info">
            <h2 class="chat__name">Community</h2>
            <p class="chat__count"></p>
          </div>
          <button class="btn" type="button" data-leave hidden>Leave room</button>
        </header>
        <p class="chat__about" data-about hidden></p>

        <div class="messages-wrap">
          <ol class="messages" aria-label="Messages"></ol>
          <button class="chat__jump" type="button" data-jump hidden>New messages ↓</button>
        </div>

        <form class="composer" data-composer hidden>
          <label class="visually-hidden" for="message">Message</label>
          <textarea class="composer__input" id="message" name="message" rows="1" maxlength="1000"
                    placeholder="Message the room…" autocomplete="off"></textarea>
          <button class="btn btn--solid" type="submit">Send</button>
        </form>
        <div class="composer-gate" data-gate hidden>
          <p data-gate-text></p>
          <button class="btn btn--solid" type="button" data-gate-action></button>
        </div>
      </div>
    </section>

  </main>


  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="site-footer__line">Wandr — travel in Ghana, planned in one place.</p>
      <nav>
        <ul class="site-footer__nav">
          <li><button class="link-btn" type="button" data-dialog="about">About</button></li>
          <li><button class="link-btn" type="button" data-dialog="contact">Contact</button></li>
          <li><button class="link-btn" type="button" data-dialog="privacy">Privacy</button></li>
          <li><button class="link-btn" type="button" data-dialog="tour">Take the tour</button></li>
        </ul>
      </nav>
      <p class="site-footer__copy">&copy; 2026 Wandr.</p>
    </div>
  </footer>

</body>

</html>
