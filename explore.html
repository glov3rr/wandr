<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore the map — Wandr</title>
  <meta name="description" content="Plan travel in Ghana in one place: attractions, trips, stays and other travellers.">

  <link rel="icon" type="image/png" href="Images/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="exploredesign.css">

  <script>document.documentElement.classList.add("js");</script>
  <script type="module" src="js/main.js"></script>
</head>

<body data-page="explore">

  <header class="site-header">
    <div class="site-header__inner">
      <a class="logo" href="home.html">
        <img src="Images/apple-touch-icon.png" alt="" width="30" height="30">
        <span>Wandr.</span>
      </a>
      <nav class="main-nav" id="main-nav">
        <ul>
          <li><a href="home.html">Home</a></li>
          <li><a class="is-current" href="explore.html">Explore</a></li>
          <li><a href="trips.html">Trips</a></li>
          <li><a href="stays.html">Stays</a></li>
          <li><a href="community.html">Community</a></li>
        </ul>
      </nav>
      <a class="btn btn--solid" href="signin.html">Sign in</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
        <span class="menu-toggle__bars" aria-hidden="true"></span>
        <span class="visually-hidden">Menu</span>
      </button>
    </div>
  </header>


  <main class="page">

    <section class="intro">
      <p class="intro__greeting" data-explore-summary>Loading places…</p>
      <h1 class="intro__title">Explore the map</h1>
    </section>

    <section class="search">
      <form class="search__form" role="search">
        <label class="visually-hidden" for="search">Search on the map</label>
        <input class="search__input" type="search" id="search" name="search" placeholder="Search on the map...">
        <button class="btn btn--solid" type="submit">Search</button>
      </form>
    </section>

    <section class="categories">
      <h2 class="visually-hidden">Filter by category</h2>
      <ul class="chips" data-chips></ul>
    </section>

    <section class="explore">
      <div class="map">
        <img class="map__base" src="Images/ghana map.jpg" alt="Map of Ghana showing attraction locations" width="800" height="1039">
        <div data-pins></div>
        <div class="legend">
          <h2 class="legend__title">Legend</h2>
          <ul data-legend></ul>
        </div>
      </div>

      <aside class="places">
        <h2 class="places__title">All places</h2>
        <ul class="places__list" data-place-list></ul>
        <p class="empty" hidden>No places match. Try another word or category.</p>
      </aside>
    </section>

  </main>


  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="site-footer__line">Wandr — travel in Ghana, planned in one place.</p>
      <nav>
        <ul class="site-footer__nav">
          <li><button class="link-btn" type="button" data-dialog="about">About</button></li>
          <li><button class="link-btn" type="button" data-dialog="contact">Contact</button></li>
          <li><button class="link-btn" type="button" data-dialog="privacy">Privacy</button></li>
          <li><button class="link-btn" type="button" data-dialog="tour">Take the tour</button></li>
        </ul>
      </nav>
      <p class="site-footer__copy">&copy; 2026 Wandr.</p>
    </div>
  </footer>

</body>

</html>
