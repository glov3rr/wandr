<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Places to stay — Wandr</title>
  <meta name="description" content="Plan travel in Ghana in one place: attractions, trips, stays and other travellers.">

  <link rel="icon" type="image/png" href="Images/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="staysdesign.css">

  <script>document.documentElement.classList.add("js");</script>
  <script type="module" src="js/main.js"></script>
</head>

<body data-page="stays">

  <header class="site-header">
    <div class="site-header__inner">
      <a class="logo" href="home.html">
        <img src="Images/apple-touch-icon.png" alt="" width="30" height="30">
        <span>Wandr.</span>
      </a>
      <nav class="main-nav" id="main-nav">
        <ul>
          <li><a href="home.html">Home</a></li>
          <li><a href="explore.html">Explore</a></li>
          <li><a href="trips.html">Trips</a></li>
          <li><a class="is-current" href="stays.html">Stays</a></li>
          <li><a href="community.html">Community</a></li>
        </ul>
      </nav>
      <a class="btn btn--solid" href="signin.html">Sign in</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
        <span class="menu-toggle__bars" aria-hidden="true"></span>
        <span class="visually-hidden">Menu</span>
      </button>
    </div>
  </header>


  <main class="page">

    <section class="intro">
      <p class="intro__greeting" data-hotel-summary>Loading stays…</p>
      <h1 class="intro__title">Places to stay</h1>
    </section>

    <section class="stays">
      <aside class="filters">
        <button class="btn filters__toggle" type="button" aria-expanded="false" aria-controls="filter-form">Show filters</button>
        <form id="filter-form" data-stay-filters>
          <h2 class="filters__title">Filter</h2>

          <p class="field">
            <label class="field__label" for="region">Region</label>
            <select class="field__input" id="region" name="region">
              <option value="">All regions</option>
            </select>
          </p>

          <p class="field">
            <label class="field__label" for="price">Max price per night</label>
            <input class="field__input field__input--range" type="range"
                   id="price" name="price" min="200" max="3000" step="50" value="3000">
            <output class="field__readout" for="price">GHS 3,000+</output>
          </p>

          <fieldset class="fieldset">
            <legend class="fieldset__legend">Rating</legend>
            <div class="check-stack">
              <label class="check"><input type="radio" name="rating" value="any" checked> Any</label>
              <label class="check"><input type="radio" name="rating" value="4"> 4.0 and above</label>
              <label class="check"><input type="radio" name="rating" value="4.5"> 4.5 and above</label>
            </div>
          </fieldset>

          <fieldset class="fieldset">
            <legend class="fieldset__legend">Amenities</legend>
            <div class="check-stack" data-amenity-options></div>
          </fieldset>

          <div class="filters__actions">
            <button class="btn btn--solid" type="submit">Apply</button>
            <button class="btn" type="reset">Reset</button>
          </div>
        </form>
      </aside>

      <div class="results">
        <div class="results__bar">
          <p class="results__count" data-result-count></p>
          <p class="field field--inline">
            <label class="field__label" for="sort">Sort by</label>
            <select class="field__input" id="sort" name="sort">
              <option value="recommended">Recommended</option>
              <option value="price-low">Price: low to high</option>
              <option value="price-high">Price: high to low</option>
              <option value="rating">Rating</option>
            </select>
          </p>
        </div>
        <ul class="stay-list" data-stay-list></ul>
        <p class="empty" hidden>No stays match these filters. Raise the price limit or untick an amenity.</p>
      </div>
    </section>

  </main>


  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="site-footer__line">Wandr — travel in Ghana, planned in one place.</p>
      <nav>
        <ul class="site-footer__nav">
          <li><button class="link-btn" type="button" data-dialog="about">About</button></li>
          <li><button class="link-btn" type="button" data-dialog="contact">Contact</button></li>
          <li><button class="link-btn" type="button" data-dialog="privacy">Privacy</button></li>
        </ul>
      </nav>
      <p class="site-footer__copy">&copy; 2026 Wandr.</p>
    </div>
  </footer>

</body>

</html>
